[project]
name = "pretopcli"
version = "0.1.0"
description = "CLI using the Pretop library"
readme = "README.md"
authors = [
    { name = "AndersonBillss", email = "anderson@thebillsfamily.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pretop",
]

[dependency-groups]
dev = [
    "pybind11>=3.0",
    "scikit-build-core>=1.0",
]

[tool.uv]
package = false
no-build-isolation-package = ["pretop"]

[tool.uv.workspace]
members = [
    "packages/pretop",
]

[tool.uv.sources]
pretop = { workspace = true, editable = true }
